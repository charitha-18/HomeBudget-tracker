<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Category Budget | Home Budget Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            color: #243b5a;
        }

        .edit-container {
            max-width: 450px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #14213d;
            margin: 0 0 25px;
            font-size: 24px;
        }

        .budget-details {
            background: #f3f6fb;
            padding: 15px;
            border-radius: 9px;
            margin-bottom: 22px;
        }

        .budget-details p {
            margin: 8px 0;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .cancel:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .edit-container {
                margin: 35px 15px;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="edit-container">

        <h2>✏️ Edit Category Budget</h2>

        <div class="budget-details">
            <p>
                <strong>Category:</strong>
                {{ budget.category }}
            </p>

            <p>
                <strong>Month:</strong>
                {{ budget.budget_month }}
            </p>
        </div>

        <form method="POST">

            <label for="budget_limit">
                Monthly Budget Limit (₹)
            </label>

            <input
                type="number"
                id="budget_limit"
                name="budget_limit"
                value="{{ budget.budget_limit }}"
                min="0.01"
                step="0.01"
                required
            >

            <button type="submit">
                Save Changes
            </button>

        </form>

        <a class="cancel"
           href="{{ url_for('category_budgets', month=budget.budget_month|string) }}">
            ← Cancel and Go Back
        </a>

    </div>

</body>
</html>
