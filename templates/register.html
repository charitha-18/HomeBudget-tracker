<!DOCTYPE html>
<html>
<head>
    <title>Register - Home Budget Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e0f2fe;
            font-family: Arial, sans-serif;
            color: #0f172a;
        }

        .register-box {
            width: 90%;
            max-width: 400px;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #0369a1;
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            background: #f0f9ff;
            color: #0f172a;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 5px rgba(2, 132, 199, 0.2);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0369a1;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #475569;
        }

        a {
            color: #0284c7;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .register-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>CREATE ACCOUNT</h1>

        <p class="subtitle">Join Home Budget Tracker</p>

        <form method="POST">

            <input type="text"
                   name="name"
                   placeholder="Full name"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email address"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Create password (8+ characters)"
                   minlength="8"
                   required>

            <button type="submit">REGISTER</button>

        </form>

        <div class="login-link">
            Already registered?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </div>

</body>
</html>
